name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: linux-x64, flag: bun-linux-x64 }
          - { name: linux-arm64, flag: bun-linux-arm64 }
          - { name: darwin-x64, flag: bun-darwin-x64 }
          - { name: darwin-arm64, flag: bun-darwin-arm64 }
          - { name: windows-x64, flag: bun-windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: >
          bun build --compile --minify
          --target=${{ matrix.target.flag }}
          ./index.ts
          --outfile dist/scaler-${{ matrix.target.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: scaler-${{ matrix.target.name }}
          path: dist/scaler-${{ matrix.target.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
